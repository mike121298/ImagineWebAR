<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content='width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, orientation=portrait">

    <title>十三行博物館|尋找遺物</title>
    <link rel="icon" href="Logo.png" type="image/png">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html {
            height: -webkit-fill-available;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100svh;
            min-height: -webkit-fill-available;
            width: 100svw;
            overflow: hidden;
        }

        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #fffa;
            z-index: 99;
        }

        #startARButton {
            padding: 10px 80px;
            /* 設定內邊距 */
            font-size: 30px;
            font-weight: bold;
            color: white;
            border: 20px solid transparent;
            /* 設定透明邊框 */
            /* 使用同一張圖片處理邊框 */
            border-image: url('BT_1.png') 50 stretch;
            /* 邊框圖片的切片設定 */
            /* 使用同一張圖片填充中間區域 */
            background-image: url("BT_2.png");
            background-repeat: no-repeat;
            background-position: center;
            /* 背景圖片置中 */
            background-size: 105% 105%;
            /* 背景圖片填充整個區域 */
            background-color: transparent;
            /* 確保背景透明 */
            display: inline-block;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        #requestPermissionsButton {
            padding: 10px 40px;
            /* 設定內邊距 */
            font-size: 30px;
            font-weight: bold;
            color: white;
            border: 20px solid transparent;
            /* 設定透明邊框 */
            /* 使用同一張圖片處理邊框 */
            border-image: url('BT_1.png') 50 stretch;
            /* 邊框圖片的切片設定 */
            /* 使用同一張圖片填充中間區域 */
            background-image: url("BT_2.png");
            background-repeat: no-repeat;
            background-position: center;
            /* 背景圖片置中 */
            background-size: 105% 105%;
            /* 背景圖片填充整個區域 */
            background-color: transparent;
            /* 確保背景透明 */
            display: inline-block;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            /*  border: 4px solid transparent;  */
            /* 設置透明邊框 */
            background: conic-gradient(#ffbe8a, #f3d6ae);
            /* 漸層色 */
            mask: radial-gradient(circle, transparent 60%, black 61%);
            -webkit-mask: radial-gradient(circle, transparent 60%, black 61%);
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!--IMAGETARGETS-->
    <imagetarget id='coin' src='targets/coin.png'></imagetarget>
    <imagetarget id='bow1' src='targets/bow1.png'></imagetarget>
    <imagetarget id='bow2' src='targets/bow2.png'></imagetarget>
    <imagetarget id='bow3' src='targets/bow3.png'></imagetarget>
    <imagetarget id='vase1' src='targets/vase1.png'></imagetarget>
    <imagetarget id='vase2' src='targets/vase2.png'></imagetarget>
    <imagetarget id='vase3' src='targets/vase3.png'></imagetarget>
    
    <video id="webcam-video" muted autoplay playsinline style="width:1px;position:absolute"></video>
    <canvas id="video-canvas" style="width:100%; height:100%; object-fit:cover; position:absolute"></canvas>
    <div id="startARDiv" class="ctaDiv"
        style="background-image: url('background.png'); background-size: cover; width: 100svw; height: 100svh;">
        <div style="position: absolute; bottom: 5svh; left: 0; z-index: -1;">
        </div>
        <div
            style="height: 80%; width: 80%; margin: 0 auto; display: flex; flex-direction: column;position: relative; align-items:center; justify-content: space-between;">
            <img src="上方漸層背景.png" style="position: absolute;bottom:  0;width: auto; height: 120%;">
            <img src="Logo.png" style="position: absolute;bottom: 20%;width: auto; height: 65%;">
            <img src="人偶裝飾.png" style="position: absolute;bottom: -10%;width: auto; height: 50%;">
        </div>
        <div style=" height: 80svh; width:auto; display: flex; flex-direction: column; align-items: center; ">
            <p></p>
            <p id="text_infro" style="white-space: nowrap;width: auto;
            font-size: min(6svw, 20px) ;text-align: center; font-weight:bold;color:  #632F00;margin: 0;">
                「透視古今，讓歷史在你眼前重現。」</p>
            <p></p>
            <p id="text_infro"
                style="/* white-space: nowrap; */width: auto;
            font-size: min(4svw, 20px) ;text-align: center; font-weight:bold;color: #632F00;margin: 0; padding: 0 20px;  ">
                《博古通今》是一場連結古代與現代的AR互動體驗。
                透過擴增實境，你將穿越千年時光，近距離觀察文物、重構歷史場景。

                每一次探索，都是一次知識的挖掘——
                。</p>
            <button id="requestPermissionsButton" onclick="RequestPermissions()">相機授權</button>
            <p id="text_infro" style="white-space: nowrap;width: auto;
            font-size: min(6svw, 80px) ;text-align: center; font-weight: bold;color: #9E0000;margin: 0;">
                需要訪問設備的相機
            </p>
            <button id="startARButton" style=" display:none;font-weight: bold; color:rgb(255, 255, 255)"
                onclick="StartAR()">開始</button>

            <p id="text_infro" style="white-space: nowrap;width: auto;
            font-size: min(4svw, 20px) ;text-align: center; font-weight: bold;color: #9E0000;margin: 0;">
                請以網頁瀏覽器開啟。
            </p>
            <p id="text_Authorization" style="display:none;text-align: center; font-size: min(6svw, 80px) ; 
                 font-weight: bold;color:rgb(54, 28, 13);margin: 0;">
                授權成功
            </p>
            <p id="text_infro_denied" style="white-space: nowrap;width: auto;margin: 0;
            font-size: min(4svw, 20px) ;text-align: center; font-weight: bold;color: #9E0000;display:none;">
                相機訪問被拒絕。</p>

            <div class="loading-spinner" id="spinner"></div>
        </div>
        <img src="十三行.png" style="width: 200px;bottom: 0; height: auto;">

        <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select>
        <!-- <p style="text-align: center; width:60svw;">This augmented reality experience requires access to your device's camera</p> -->
        <!-- <button id="startARButton" onclick="StartAR()" style="display:none">ALLOW ACCESS</button> -->
    </div>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">
        <div
            style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25);">
            <img id="screenshotImg" src="" alt="screenshot" style="width:80svw; height:80svh">
            <button onclick="document.getElementById('screenshotDiv').style.display = 'none';"
                style="position:absolute; transform:translateY(-100%); right:0; top:0">Close</button>
        </div>
    </div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">
        <div
            style="position:relative; background-color:white; padding:10px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.3), 0 6px 20px 0 rgba(0, 0, 0, 0.25); width: 80svw; display:flex; flex-direction: column; align-items: center;">
            <p id="confirmUrlText" style="text-align: center; width:80%; overflow: hidden; text-overflow: ellipsis;">Are
                you sure you want to visit url.com?</p>
            <div>
                <button
                    onclick="window.open(newUrlString, '_blank').focus(); document.getElementById('confirmUrlDiv').style.display = 'none'">VISIT
                    SITE</button>
                <button onclick="document.getElementById('confirmUrlDiv').style.display = 'none'">GO BACK</button>
            </div>
        </div>
    </div>
    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">
        <p id="errorText" style="text-align: center; width:60svw; color:white"></p>
    </div>
    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas" style="width: 100%; height: 100%;  z-index: -99"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <canvas id="video-canvas"></canvas>
    </div>
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <script src="Build/ImagineWebAR.loader.js"></script>
    <script>
        var initialize = async () => {
            var unityCanvas = document.querySelector("#unity-canvas");
            var videoCanvas = document.querySelector("#video-canvas");
            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.iTracker = new ImageTracker(arCamera);
            try {
                await window.iTracker.initialize("./opencv.js");
                console.log("ImageTracker initialized!");
            }
            catch {
                console.error("Failed to initialize ImageTracker. Are you missing opencv.js? " + error);
                ShowError("Failed to initialize the experience.");
                return;
            }

            await LoadWebcams();
            // document.getElementById("startARButton").style.display = "block";
            window.permissionsGranted = IsCameraPermissionGranted();
        }
        initialize();
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        function StartAR() {
            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";

            document.getElementById("startARDiv").style.display = "none";
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/ImagineWebAR.data",
                frameworkUrl: "Build/ImagineWebAR.framework.js",
                codeUrl: "Build/ImagineWebAR.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "ImagineWebAR",
                productVersion: "v1.10",
                //webglContextAttributes: { "preserveDrawingBuffer": true },
                // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
                // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
            },
                (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }
            ).then((unityInstance) => {
                window.unityInstance = unityInstance;
                if (window.permissionsGranted)
                    RequestWebcam();
                loadingBar.style.display = "none";
            });
            loadingBar.style.display = "block";
        }
        //Set Facing Mode here ('environment', 'user', '')
        window.unityFacingMode = "environment"
        window.WEBCAM_SETTINGS = {
            video: {
                facingMode: unityFacingMode,
            },
            audio: false
        };
        window.requestingForPermissions = false;
        async function RequestWebcam() {
            window.requestingForPermissions = true;
            try {
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                console.log("Webcam access granted");
                requestingForPermissions = false;
                // Immediately stop the stream to release the camera
                StopWebcam();
            }
            catch (err) {
                //user denied camera permission - show error panel
                console.error("getUserMedia error - ", err);
                ShowError("未能開始體驗。相機許可被拒絕，請重新整理後授權後再試。");
                window.requestingForPermissions = false;
            }
        }
        function StopWebcam() {
            console.log("stopping camera");
            window.webcamStream.getTracks().forEach(track => track.stop());
        }
        async function StartWebcam() {
            console.log("StartWebcam")
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
            while (window.requestingForPermissions) {
                // Wait until requestingForPermissions becomes true.
                console.log("Waiting for permissions...");
                await new Promise(resolve => setTimeout(resolve, 100)); // Adjust the delay time as needed.
            }
            console.log("Got Permissions");
            if (window.webcamStream) {
                const video = document.querySelector("#webcam-video");
                video.srcObject = webcamStream;
                try {
                    await arCamera.startWebcam(video);
                    console.log("Webcam started successfully");
                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
                }
                catch (err) {
                    console.error("Webcam failed to start - ", err);
                    window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
                }
            }
            else {
                console.error("Webcam failed to start - permission not yet granted");
                window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
            }
        }
        async function LoadWebcams() {
            let camDevices = [];
            // let backCams = [];
            let devices = await navigator.mediaDevices.enumerateDevices();
            var ctr = 0;
            devices.forEach(mediaDevice => {
                if (mediaDevice.kind === 'videoinput') {
                    if (window.unityFacingMode == 'environment' && !mediaDevice.label.includes('facing front')) {
                        //back cam only
                        camDevices.push(mediaDevice);
                    }
                    else if (window.unityFacingMode == 'user' && mediaDevice.label.includes('facing front')) {
                        //front cam only
                        camDevices.push(mediaDevice);
                    }
                    else {
                        //back and front
                        camDevices.push(mediaDevice);
                    }

                    ctr++;
                }
            });
            var select = document.getElementById("chooseCamSel");
            // select.style.display = "block";
            var count = 0;
            //reverse array because some Android phones can't distinguish front and back cams at first load
            //and when this happens, most of the time, front cam goes first and back cam goes last
            camDevices = camDevices.reverse();
            camDevices.forEach(mediaDevice => {
                const option = document.createElement('option');
                option.value = mediaDevice.deviceId;
                let label = `Camera ${count}`;
                if (mediaDevice.label) {
                    label = mediaDevice.label
                }
                const textNode = document.createTextNode(label);
                option.appendChild(textNode);
                select.appendChild(option);
                count++;
            });
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        function SelectCam() {
            var select = document.getElementById("chooseCamSel");
            window.deviceId = select.value;
            window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
            //console.log(window.WEBCAM_SETTINGS);
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        async function FlipCam() {
            arCamera.stopWebcam();
            window.WEBCAM_SETTINGS.video.deviceId = '';
            if (window.WEBCAM_SETTINGS.video.facingMode == 'user') {
                window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                arCamera.setFlipped(false);
            }
            else {
                window.WEBCAM_SETTINGS.video.facingMode = 'user';
                arCamera.setFlipped(true);
            }
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
            const video = document.querySelector("#webcam-video");
            video.srcObject = webcamStream;
            await arCamera.startWebcam(video);
        }
        async function IsCameraPermissionGranted() {
            if (!navigator.permissions || !navigator.mediaDevices) {
                console.log("Permissions API or mediaDevices not supported.");
                return false;
            }
            try {
                // Query the status of the camera permission
                const permissionStatus = await navigator.permissions.query({ name: "camera" });
                if (permissionStatus.state === "granted") {
                    console.log("Camera permission has already been granted.");
                    return true;
                } else if (permissionStatus.state === "prompt") {
                    console.log("Camera permission is promptable.");
                    return false;
                } else {
                    console.log("Camera permission has been denied.");
                    return false;
                }
            } catch (error) {
                console.log("Error checking camera permission:", error);
                return false;
            }
        }
        function ShowError(error) {
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").innerHTML = error;
        }
        function ShowScreenshot(dataUrl) {
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80svw";
            document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "svw";
        }
        function ShowConfirmUrl(url) {
            document.getElementById("confirmUrlDiv").style.display = "flex";
            window.newUrlString = url;
            document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;
        }
        window.ITRACKER_GLOBALS = {
            //place global settings here
            INTERNAL_SMOOTHFACTOR_POS: .075,
        }

        function RequestPermissions() {
            let cameraGranted = false;
            // let locationGranted = false;
            // **如果相機和位置都授權，顯示按鈕**
            if (cameraGranted /* && locationGranted */) {
                document.getElementById("startARButton").style.display = "block";
            }
            // 顯示旋轉圈
            const spinner = document.getElementById("spinner");
            spinner.style.display = "block"; // 顯示旋轉圈
            // setTimeout(() => {
            //     spinner.style.display = "none"; // 模擬讀取完成後隱藏
            //     alert("讀取完成！");
            // }, 3000); // 假設讀取時間 3 秒
            navigator.permissions.query({ name: 'camera' }).then((result) => {
                console.log("相機權限狀態:", result.state);
                if (result.state === "granted") {
                    console.log("相機已授權"); cameraGranted = true; checkPermissions();
                } else if (result.state === "prompt") {
                    console.log("相機授權尚未決定...");
                    // 相機授權
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(() => {
                            console.log("Camera access granted");
                            cameraGranted = true;
                            checkPermissions();
                        })
                        .catch(err => { console.log("相機授權尚未決定", err); spinner.style.display = "none"; document.getElementById("text_infro_denied").style.display = "block"; });
                } else {
                    console.log("相機被拒絕...");
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(() => {
                            console.log("Camera access granted");
                            cameraGranted = true;
                            checkPermissions();
                        })
                        .catch(err => { console.log("相機被拒絕", err); spinner.style.display = "none"; document.getElementById("text_infro_denied").style.display = "block"; });
                }
            });
            // 相機授權
            // navigator.mediaDevices.getUserMedia({ video: true })
            //     .then(() => {
            //         console.log("Camera access granted");
            //         cameraGranted = true;
            //         checkPermissions();
            //     })
            //     .catch(err => console.log("Camera access denied", err));
            // // 位置授權
            // navigator.geolocation.getCurrentPosition(
            //     position => {
            //         console.log("Location access granted", position);
            //         locationGranted = true;
            //         checkPermissions();
            //     },
            //     error => console.error("Location access denied", error)
            // );
            // 檢查是否可以顯示 StartAR 按鈕
            function checkPermissions() {
                if (cameraGranted /* && locationGranted */) {
                    spinner.style.display = "none";
                    document.getElementById("startARButton").style.display = "block";
                    document.getElementById("requestPermissionsButton").style.display = "none";
                    document.getElementById("text_infro").style.display = "none";
                    document.getElementById("text_Authorization").style.display = "block";
                    document.getElementById("text_infro_denied").style.display = "none";
                }
            }
        }
    </script>
</body>
